<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI — Top Program</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#08070d;color:#fff;overflow:hidden}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 15%,#6d42b855,transparent 32%),radial-gradient(circle at 85% 85%,#2878ff22,transparent 30%);filter:blur(35px);pointer-events:none}.app{width:min(1100px,94vw);height:min(720px,92vh);margin:4vh auto;display:grid;grid-template-columns:245px 1fr;gap:1px;background:#ffffff10;border:1px solid #ffffff12;border-radius:28px;overflow:hidden;box-shadow:0 30px 100px #0008}aside{background:#0d0b14dd;padding:24px;display:flex;flex-direction:column}.brand{font-size:25px;font-weight:850;letter-spacing:-1px;margin-bottom:35px}.brand span{color:#9b79ff}nav{display:grid;gap:8px}button{font:inherit;color:inherit;border:0;cursor:pointer}.nav{background:transparent;text-align:left;padding:13px 14px;border-radius:13px;color:#aaa}.nav.active,.nav:hover{background:#ffffff0d;color:#fff}.bottom{margin-top:auto;color:#777;font-size:12px}main{background:#0a0910ee;display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid #ffffff0c;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.status{display:flex;gap:8px;align-items:center;color:#aaa;font-size:13px}.dot{width:8px;height:8px;background:#7cffae;border-radius:50%;box-shadow:0 0 14px #7cffae}.chat{flex:1;overflow:auto;padding:40px}.hero{max-width:720px;margin:7vh auto 0;text-align:center}.orb{width:74px;height:74px;margin:auto;border-radius:24px;background:linear-gradient(135deg,#9b72ff,#4268ff);display:grid;place-items:center;font-size:31px;font-weight:900;box-shadow:0 0 50px #7355ff55}.hero h1{font-size:44px;letter-spacing:-2px;margin:22px 0 10px}.hero p{color:#85818f;font-size:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.card{padding:17px;text-align:left;background:#ffffff06;border:1px solid #ffffff0b;border-radius:16px;transition:.2s}.card:hover{transform:translateY(-3px);background:#ffffff0b}.card b{display:block;margin-bottom:7px}.card small{color:#777}.composer{padding:18px 25px;border-top:1px solid #ffffff0c}.box{display:flex;gap:10px;background:#12101a;border:1px solid #ffffff12;border-radius:18px;padding:8px}.box input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:12px;font-size:15px}.send{width:44px;height:44px;border-radius:13px;background:#8b68ff;font-size:18px}.send:hover{background:#a080ff}.msg{max-width:760px;margin:0 auto 18px;padding:15px 17px;border-radius:17px;background:#ffffff08;line-height:1.55}.msg.user{margin-right:0;background:#7d5cff22}.hidden{display:none}@media(max-width:700px){.app{grid-template-columns:1fr;height:94vh;margin:3vh auto}aside{display:none}.hero h1{font-size:34px}.cards{grid-template-columns:1fr}.chat{padding:25px}.top{padding:0 17px}}
</style></head><body><div class="app"><aside><div class="brand">KAI<span>•</span></div><nav><button class="nav active" data-page="home">⌂ Главная</button><button class="nav" data-page="chat">✦ Новый чат</button><button class="nav" data-page="tools">⚡ Инструменты</button></nav><div class="bottom">KAI Top Program<br>Single-file edition</div></aside><main><div class="top"><div id="title">KAI</div><div class="status"><i class="dot"></i> Система готова</div></div><section class="chat" id="chat"><div class="hero" id="hero"><div class="orb">K</div><h1>Что будем делать?</h1><p>Быстрый интерфейс KAI в одном HTML-файле.</p><div class="cards"><button class="card" data-prompt="Придумай идею проекта"><b>💡 Идея</b><small>Придумать что-нибудь крутое</small></button><button class="card" data-prompt="Объясни JavaScript простыми словами"><b>🧠 Объяснение</b><small>Разобраться в сложном</small></button><button class="card" data-prompt="Напиши план приложения"><b>🚀 Проект</b><small>Начать новый проект</small></button></div></div><div id="messages"></div></section><div class="composer"><div class="box"><input id="input" placeholder="Напиши сообщение..."><button class="send" id="send">➤</button></div></div></main></div><script>
const input=document.querySelector('#input'),send=document.querySelector('#send'),messages=document.querySelector('#messages'),hero=document.querySelector('#hero'),title=document.querySelector('#title');function ask(t){t=t.trim();if(!t)return;hero.classList.add('hidden');let u=document.createElement('div');u.className='msg user';u.textContent=t;messages.append(u);let a=document.createElement('div');a.className='msg';a.innerHTML='<b>KAI</b><br>Сообщение принято. Интерфейс готов к подключению твоего API. 😎';messages.append(a);document.querySelector('.chat').scrollTop=1e9;input.value=''}send.onclick=()=>ask(input.value);input.onkeydown=e=>{if(e.key==='Enter')ask(input.value)};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>ask(b.dataset.prompt));document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=b.dataset.page==='tools'?'Инструменты':b.dataset.page==='chat'?'Новый чат':'KAI';if(b.dataset.page==='home'){hero.classList.remove('hidden');messages.innerHTML=''}});</script></body></html>
