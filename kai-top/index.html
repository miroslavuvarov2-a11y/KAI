<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI TOP</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07070d;color:#f5f3ff;min-height:100vh}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 15%,#5f35b455,transparent 30%),radial-gradient(circle at 80% 80%,#263caa22,transparent 28%);pointer-events:none}.app{position:relative;max-width:1050px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:25px;font-weight:850}.logo span{color:#a77bff}.badge{padding:7px 11px;border:1px solid #ffffff18;border-radius:999px;background:#ffffff08;color:#bfb8d5;font-size:12px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:#10101aee;border:1px solid #ffffff12;border-radius:22px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(18px);padding:20px}h1{font-size:clamp(30px,5vw,54px);line-height:.98;margin:4px 0 12px;letter-spacing:-2px}p{color:#aaa4b9;line-height:1.55}textarea{width:100%;min-height:250px;resize:vertical;border:1px solid #ffffff12;border-radius:16px;background:#080810;color:#fff;padding:16px;font:inherit;outline:none}textarea:focus{border-color:#8d63ff88;box-shadow:0 0 0 3px #8d63ff18}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:11px 15px;background:#1b1926;color:#eee;cursor:pointer;font-weight:700}button:hover{background:#29243a}button.primary{background:linear-gradient(135deg,#8d5cff,#5b7cff)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{padding:14px;border-radius:15px;background:#ffffff06;border:1px solid #ffffff0c}.stat b{display:block;font-size:23px}.stat small{color:#8f899d}.history{max-height:360px;overflow:auto;margin-top:10px}.item{padding:12px;border-bottom:1px solid #ffffff0b;cursor:pointer}.item:hover{background:#ffffff06}.item small{color:#777181}.result{margin-top:12px;padding:14px;border-radius:14px;background:#080810;border:1px solid #ffffff0c;min-height:54px;white-space:pre-wrap;color:#d8d2e5}@media(max-width:760px){.grid{grid-template-columns:1fr}.app{padding:18px 12px}}
</style></head><body><div class="app"><div class="top"><div class="logo">KAI <span>TOP</span></div><div class="badge">single-file studio</div></div><div class="grid"><section class="card"><h1>Идея → готовый текст.</h1><p>Мини-студия для быстрых заметок, расчётов и заготовок прямо в браузере.</p><textarea id="input" placeholder="Напиши задачу, идею или текст..."></textarea><div class="actions"><button class="primary" onclick="run()">⚡ Обработать</button><button onclick="summarize()">✂️ Сжать</button><button onclick="clearAll()">🗑 Очистить</button><button onclick="copyResult()">📋 Копировать</button></div><div id="result" class="result">Результат появится здесь.</div><div class="stats"><div class="stat"><b id="chars">0</b><small>символов</small></div><div class="stat"><b id="words">0</b><small>слов</small></div></div></section><aside class="card"><b>🧠 История</b><div id="history" class="history"><p>Пока пусто.</p></div></aside></div></div><script>
const $=id=>document.getElementById(id),input=$('input'),result=$('result'),history=$('history');input.addEventListener('input',update);
function update(){let t=input.value.trim();$('chars').textContent=input.value.length;$('words').textContent=t?t.split(/\s+/).length:0}
function run(){const t=input.value.trim();if(!t)return result.textContent='Сначала что-нибудь напиши 🙂';const lines=t.split(/\n+/).filter(Boolean);const out='Готовая структура:\n\n'+lines.map((x,i)=>(i+1)+'. '+x.trim()).join('\n');result.textContent=out;save(t,out)}
function summarize(){const t=input.value.trim();if(!t)return;const s=t.split(/(?<=[.!?])\s+/).filter(Boolean);result.textContent=s.slice(0,Math.max(1,Math.ceil(s.length/2))).join(' ');save(t,result.textContent)}
function save(t,out){let h=JSON.parse(localStorage.getItem('kaiTopHistory')||'[]');h.unshift({t:t,out:out,at:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});h=h.slice(0,12);localStorage.setItem('kaiTopHistory',JSON.stringify(h));render()}
function render(){let h=JSON.parse(localStorage.getItem('kaiTopHistory')||'[]');window._h=h;history.innerHTML=h.length?h.map((x,i)=>'<div class="item" onclick="loadItem('+i+')"><div>'+escapeHtml(x.t.slice(0,70))+'</div><small>'+x.at+'</small></div>').join(''):'<p>Пока пусто.</p>'}
function loadItem(i){let x=window._h[i];input.value=x.t;result.textContent=x.out;update()}
function copyResult(){navigator.clipboard?.writeText(result.textContent)}
function clearAll(){input.value='';result.textContent='Результат появится здесь.';update()}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}render();update();
</script></body></html>
