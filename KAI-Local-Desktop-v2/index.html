<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI Local Desktop</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#27334d;--text:#edf3ff;--muted:#9aa9c5;--accent:#8b7cff;--user:#29345b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182344 0,#0b1020 58%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:min(100%,1000px);height:100vh;display:flex;flex-direction:column;padding:18px;gap:14px}header{display:flex;align-items:center;gap:12px;padding:8px 4px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#8b7cff,#38d9c5);color:#081020;font-weight:900;font-size:22px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted)}.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#f0b44d}.dot.ok{background:#39dba4}
main{flex:1;min-height:0;background:#0e1526c9;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar label{font-size:12px;color:var(--muted)}select,button,textarea{font:inherit}select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;max-width:100%}
#messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.welcome{margin:auto;text-align:center;max-width:500px;color:var(--muted)}.welcome h2{color:var(--text);font-size:25px;margin:0 0 8px}.bubble{max-width:min(85%,760px);padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:var(--user);border:1px solid #414f83}.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.who{font-size:11px;color:var(--muted);margin-bottom:5px}
.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end}.composer textarea{resize:vertical;min-height:48px;max-height:180px;flex:1;background:#0b1020;border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);outline:none}.composer textarea:focus{border-color:var(--accent)}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:wait}.secondary{background:#202b43;border:1px solid var(--line);color:var(--text)}.mic.active{background:#b84f65}.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px;padding:0 4px}.error{color:#ff9eaa}
@media(max-width:600px){.app{padding:9px;gap:8px}.bubble{max-width:95%}.composer{padding:8px;flex-wrap:wrap}.composer textarea{flex-basis:100%}.status{width:100%;margin-left:58px}.toolbar{padding:9px}}
</style></head><body><div class="app">
<header><div class="logo">K</div><div><h1>KAI Local Desktop</h1><div class="sub">Локальный ИИ · без API-ключей · без оплаты за запросы</div></div><div class="status"><span id="dot" class="dot"></span><span id="statusText">Проверяю Ollama…</span></div></header>
<main><div class="toolbar"><label for="model">Модель</label><select id="model"><option value="qwen3:4b">qwen3:4b (по умолчанию)</option></select><button class="secondary" id="refresh">Проверить ИИ</button><button class="secondary" id="clear">Очистить чат</button><label><input type="checkbox" id="speakToggle"> Озвучивать ответы</label></div>
<div id="messages"><div class="welcome" id="welcome"><h2>Привет! Я KAI 👋</h2><div>Локальный помощник на твоём компьютере. Напиши сообщение или попробуй голосовой ввод.</div></div></div>
<div class="composer"><textarea id="prompt" placeholder="Напиши KAI сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea><button class="secondary mic" id="mic">🎙️ Говорить</button><button id="send">Отправить ➤</button></div></main>
<div class="foot"><span>🔒 Запросы к модели отправляются на Ollama на этом компьютере.</span><span id="hint">Готов к работе</span></div></div>
<script>
const $=id=>document.getElementById(id), messagesEl=$('messages'), promptEl=$('prompt'), sendBtn=$('send'), micBtn=$('mic');
let history=[],busy=false,recognition=null,listening=false;
function addMessage(role,text){$('welcome')?.remove();const wrap=document.createElement('div');wrap.className='bubble '+role;const who=document.createElement('div');who.className='who';who.textContent=role==='user'?'Ты':'KAI';const body=document.createElement('div');body.textContent=text;wrap.append(who,body);messagesEl.append(wrap);messagesEl.scrollTop=messagesEl.scrollHeight;return body}
function setBusy(v){busy=v;sendBtn.disabled=v;promptEl.disabled=v;$('hint').textContent=v?'KAI думает…':'Готов к работе'}
async function checkStatus(){try{const r=await fetch('/api/status',{cache:'no-store'}),d=await r.json();$('dot').className='dot '+(d.ollama?'ok':'');$('statusText').textContent=d.ollama?'Ollama подключена':'Ollama не найдена';const sel=$('model'),current=sel.value,models=d.models||[];if(models.length){sel.replaceChildren();models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.append(o)});if(models.includes(current))sel.value=current;else if(models.includes(d.default_model))sel.value=d.default_model}else if(![...sel.options].some(o=>o.value===d.default_model)){const o=document.createElement('option');o.value=d.default_model;o.textContent=d.default_model;sel.append(o)}if(!d.ollama)$('hint').textContent='Запусти Ollama и загрузи модель'}catch(e){$('statusText').textContent='Локальный сервер недоступен';$('dot').className='dot'}}
async function send(){const text=promptEl.value.trim();if(!text||busy)return;promptEl.value='';addMessage('user',text);history.push({role:'user',content:text});setBusy(true);const body=addMessage('assistant','Подключаюсь к локальной модели…');try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),250000);let r;try{r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,model:$('model').value}),signal:controller.signal})}finally{clearTimeout(timer)}const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка локального ИИ');body.textContent=d.reply||'Пустой ответ';history.push({role:'assistant',content:body.textContent});if($('speakToggle').checked)speak(body.textContent)}catch(e){body.textContent=e.name==='AbortError'?'Ответ слишком долгий. Проверь Ollama и память компьютера.':(e.message||'Не удалось подключиться к ИИ');body.parentElement.classList.add('error');history.pop()}finally{setBusy(false);messagesEl.scrollTop=messagesEl.scrollHeight}}
function speak(text){if(!('speechSynthesis'in window)){$('hint').textContent='Озвучивание не поддерживается';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(0,5000));u.lang='ru-RU';speechSynthesis.speak(u)}
function stopListening(){listening=false;micBtn.classList.remove('active');micBtn.textContent='🎙️ Говорить';if(recognition){try{recognition.stop()}catch(e){}}}
function startListening(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('hint').textContent='Голосовой ввод не поддерживается. Используй Chrome/Edge или печатай текст.';return}if(listening){stopListening();return}try{recognition=new SR();recognition.lang='ru-RU';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;let gotText=false;recognition.onstart=()=>{listening=true;micBtn.classList.add('active');micBtn.textContent='⏹️ Стоп';$('hint').textContent='Слушаю… говори сейчас'};recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;if(t){promptEl.value=t;gotText=true}};recognition.onerror=e=>{$('hint').textContent=e.error==='not-allowed'?'Разреши доступ к микрофону.':'Ошибка микрофона: '+e.error;stopListening()};recognition.onend=()=>{const shouldSend=gotText&&promptEl.value.trim().length>0;stopListening();if(shouldSend)send();else $('hint').textContent='Речь не распознана — попробуй снова или напечатай сообщение'};recognition.start();setTimeout(()=>{if(listening)stopListening()},20000)}catch(e){stopListening();$('hint').textContent='Не удалось запустить микрофон: '+e.message}}
sendBtn.addEventListener('click',send);promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});micBtn.addEventListener('click',startListening);$('refresh').addEventListener('click',checkStatus);$('clear').addEventListener('click',()=>{history=[];messagesEl.replaceChildren();const w=document.createElement('div');w.id='welcome';w.className='welcome';w.innerHTML='<h2>Чат очищен ✨</h2><div>Начни новый разговор с KAI.</div>';messagesEl.append(w)});checkStatus();
</script></body></html>
